name: Bug report
description: Wrong numbers, a crash, or a log line that is misread
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "tokenburn version, Node version, OS, and the tool + version whose logs are involved (e.g. Claude Code 2.1.x)"
    validations:
      required: true
  - type: textarea
    id: logshape
    attributes:
      label: Shape of the log line (optional)
      description: "If a log line is misread, paste it with prompts, code and paths removed. Never paste private content."
      render: json
