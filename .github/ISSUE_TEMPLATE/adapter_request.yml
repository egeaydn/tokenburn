name: Adapter request
description: Ask for support for a new AI coding tool
labels: ["adapter", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Adapters read a tool's local logs. Only tools that store per-request token counts on disk can be supported. Cursor and Copilot currently don't, so please check before asking.
  - type: input
    id: tool
    attributes:
      label: Tool name and version
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where does it store its logs?
      description: The path(s) on each OS if you know them. Use ~ for your home folder.
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Redacted log line shape
      description: Field names and types only. Replace all values and content with placeholders.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I'm willing to write this adapter myself, with guidance from the wiki
          required: false
